name: CLA Assistant

# Fait signer le CLA (CLA.md) aux contributeurs extérieurs, une fois, en
# commentaire de leur pull request. Les signatures sont enregistrées dans
# signatures/v1/cla.json sur la branche cla-signatures, hors des règles de
# protection de WEM-2.0.
#
# Un workflow déclenché par issue_comment ne tourne que depuis la branche par
# défaut : ce fichier doit être présent sur main, sinon le commentaire de
# signature n'est jamais traité.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: >-
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA' ||
          github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/SMEWebify/WebErpMesv2/blob/WEM-2.0/CLA.md
          path-to-signatures: signatures/v1/cla.json
          branch: cla-signatures
          allowlist: SMEWebify,billyboy35,dependabot[bot]
