name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: zip, ldap, pdo_mysql, pdo_pgsql, sqlite3, bcmath, gd, intl, pcntl
          coverage: none

      - name: Configure Composer authentication
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: composer config --global github-oauth.github.com "$GITHUB_TOKEN"

      - name: Install dependencies
        run: composer install --no-progress --no-interaction --prefer-dist

      - name: Run PHPUnit
        run: vendor/bin/phpunit --colors=always

      - name: Install PHP QA tools
        run: composer global require phpstan/phpstan friendsofphp/php-cs-fixer

      - name: Run PHPStan
        run: $(composer global config bin-dir --absolute)/phpstan analyse

      - name: Run PHP-CS-Fixer (dry run)
        run: $(composer global config bin-dir --absolute)/php-cs-fixer fix --dry-run
